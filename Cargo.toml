[package]
name = "resonance-engine"
version = "11.0.0"
edition = "2021"
description = "Resonance Engine v11.0 — high-performance deterministic simulation framework"

[dependencies]
rayon = "1.8"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
hot-reload = ["libloading", "notify"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { version = "0.8", optional = true }
notify = { version = "6.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[example]]
name = "demo_v11"
path = "examples/demo_v11.rs"
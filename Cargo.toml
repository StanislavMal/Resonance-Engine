[package]
name = "resonance-engine"
version = "10.4.0"
edition = "2021"
description = "Resonance Engine v10.4 — high-performance simulation framework with GPU compute"

[dependencies]
rayon = "1.8"
rand = "0.8"
wgpu = "22.0"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
winit = "0.29"
env_logger = "0.10"
log = "0.4"
slotmap = { version = "0.2", features = ["serde"] }
rustc-hash = "1.1"
smallvec = "1.11"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1